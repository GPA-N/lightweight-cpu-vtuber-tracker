name: Security

on:
  push:
    branches: [main, "wip/**"]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

# CodeQL runs through GitHub's default setup (Settings, Code security), not from this file.

jobs:
  rustsec-audit:
    name: Dependency advisories (RustSec)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Known and accepted: ruzstd 0.8.3 comes from bevy_image 0.19.1 (pinned ^0.8), fixed only in 0.9.1.
      # Exposure: decoding zstd textures in a model file the user loads. Remove when Bevy updates ruzstd.
      # Unmaintained-crate warnings (paste, ttf-parser, via Bevy) are logged, only vulnerabilities fail the job.
      - run: cargo audit --ignore RUSTSEC-2026-0344

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

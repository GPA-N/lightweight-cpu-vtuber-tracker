name: Release

# Pushing a tag like v0.2.0 creates the GitHub Release with generated notes.
# The zip is built on the maintainer's machine (scripts/package.ps1 needs the hand models, the avatar and the
# InstantHMR body model, which are not in git) and attached with: gh release upload <tag> <zip> SHA256SUMS.txt
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

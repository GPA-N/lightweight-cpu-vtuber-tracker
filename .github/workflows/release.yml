name: Release

# CD: pushing a tag like v0.2.0 builds live.exe, bundles it and attaches the zip to a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build live.exe (release, locked)
        run: cargo build --release --locked --bin live
      - name: Fetch pinned models (SHA-256 verified)
        shell: pwsh
        run: ./scripts/fetch_models.ps1
      - name: Bundle
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Zip and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path dist/vtuber-tracker -DestinationPath vtuber-tracker-${{ github.ref_name }}-windows.zip
          (Get-FileHash vtuber-tracker-${{ github.ref_name }}-windows.zip -Algorithm SHA256).Hash.ToLower() + "  vtuber-tracker-${{ github.ref_name }}-windows.zip" | Set-Content SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            vtuber-tracker-${{ github.ref_name }}-windows.zip
            SHA256SUMS.txt
          generate_release_notes: true
[package]
name = "infer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "ONNX Runtime face, pose and hand tracking stages"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[dependencies]
core = { path = "../core" }
pose = { path = "../pose" }
smoothing = { path = "../smoothing" }
facelogic = { path = "../facelogic" }
timing = { path = "../timing" }
# CPU only: no cuda, tensorrt or directml features.
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "ndarray", "download-binaries", "copy-dylibs", "tls-native"] }
openvino = { version = "0.11.1", features = ["runtime-linking"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde_json = "1"
